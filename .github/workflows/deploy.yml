name: Discreta CI/CD

on:
  push:
    branches:
      - staging
    tags:
      - "v*"

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -euo pipefail
            cd app/Discreta
            git checkout staging
            git pull origin staging
            cd discreta/lib/app/src/2_Back_end
            cat > .env << 'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SERVER_PORT=${{ secrets.SERVER_PORT }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
            FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}
            DATA_ENCRYPTION_KEY=${{ secrets.DATA_ENCRYPTION_KEY }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}
            BASE_URL=${{ secrets.BASE_URL }}
            WEB_BASE_URL=${{ secrets.WEB_BASE_URL }}
            ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}
            REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
            EOF

            cat > serviceAccountKey.json << 'EOF'
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
            EOF

            
            npm ci
            npm run build
            docker stop discreta_app || true
            docker compose build app
            docker compose up -d app

  deploy-production:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -euo pipefail
            cd app/Discreta
            git fetch --all --tags
            cd discreta/lib/app/src/2_Back_end
            git checkout ${{ github.ref_name }}
            cat > .env << 'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SERVER_PORT=${{ secrets.SERVER_PORT }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
            FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}
            DATA_ENCRYPTION_KEY=${{ secrets.DATA_ENCRYPTION_KEY }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}
            BASE_URL=${{ secrets.BASE_URL }}
            WEB_BASE_URL=${{ secrets.WEB_BASE_URL }}
            ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}
            REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
            EOF

            cat > serviceAccountKey.json << 'EOF'
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
            EOF

            npm ci
            npm run build
            docker stop discreta_app || true
            docker compose build app
            docker compose up -d app